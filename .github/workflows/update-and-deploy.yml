# Every hour: test the code, make a fresh forecast, save it, and publish the site.
name: Update forecast and deploy

on:
  schedule:
    # Minute 5 of every hour (in UTC). GitHub is busiest at minute 0, when
    # scheduled runs are most often delayed.
    - cron: "5 * * * *"
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

# Only one run at a time, so two runs never push or deploy over each other.
# A new run waits for the current one instead of cancelling it.
concurrency:
  group: update-and-deploy
  cancel-in-progress: false

# No permissions by default. Each job asks only for what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the new forecast.json to the repository
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip # reuse downloaded packages from earlier runs

      - name: Install requirements
        run: pip install -r requirements.txt

      # If any test fails, this step fails and nothing after it runs
      - name: Run the tests
        run: pytest

      - name: Make a fresh forecast
        run: python export_forecast.py

      # git diff --staged --quiet succeeds when nothing changed, so the part
      # after || (commit and push) only runs when forecast.json is different
      - name: Save the forecast if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/forecast.json
          git diff --staged --quiet || {
            git commit -m "Update forecast for $(TZ=Europe/Madrid date '+%Y-%m-%d %H:00')"
            git push
          }

      # Packs the site folder up in the form GitHub Pages expects
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build # only runs after build has succeeded
    runs-on: ubuntu-latest
    permissions:
      pages: write # to publish to GitHub Pages
      id-token: write # to prove to Pages that this run is from this repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # shows the live link on the run
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
